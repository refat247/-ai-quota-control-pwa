# Added 2026-11-17 by Claude Opus 5.5 (Asia/Dhaka) on the owner's instruction.
# Dependabot opens update PRs weekly; nothing merges without the owner.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
