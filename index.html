/* Compact, accountable Home: a subscription is a separate provider/account group.
   Never sum percentages across distinct model quotas. */
.home-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:8px 0 12px}
.home-kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 8px;min-width:0}
.home-kpi small{color:var(--soft);font-size:10px;display:block;line-height:1.2}
.home-kpi strong{font-size:13px;line-height:1.3;display:block;margin-top:5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.home-kpi em{display:block;font-style:normal;font-size:9px;color:var(--soft);margin-top:3px}
.provider-list{display:grid;gap:8px;margin-top:10px}
.provider-row{padding:10px 11px;box-shadow:none}
.provider-row-header{display:flex;align-items:center;gap:9px;margin-bottom:8px;min-width:0}
.provider-row-header .provider-dot{width:29px;min-width:29px;height:29px;border-radius:9px}
.provider-row-headings{flex:1;min-width:0}
.provider-row-name{font-size:14px;font-weight:850;line-height:1.25;overflow-wrap:anywhere}
.provider-row-plan{font-size:10px;color:var(--muted);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.provider-row-header .inline-tag{font-size:9px;flex-shrink:0}
.provider-windows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.provider-window{border:1px solid #e8edf5;background:#f8faff;border-radius:9px;padding:6px 8px;min-width:0}
.provider-window-title{color:var(--muted);font-size:10px;font-weight:750;display:flex;align-items:center;justify-content:space-between;gap:4px}
.provider-window-value{font-size:13px;font-weight:850;line-height:1.3;white-space:normal;overflow-wrap:anywhere;margin-top:3px}
.provider-window-remaining{font-size:10px;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.provider-window-reset{font-size:10px;color:var(--soft);line-height:1.3;margin-top:4px;overflow-wrap:anywhere}
.provider-window-reset.estimated{color:var(--amber)}
.provider-mini-track{height:4px;border-radius:4px;background:#e3e9f3;overflow:hidden;margin-top:5px}
.provider-mini-fill{height:100%;background:var(--accent);border-radius:4px}
.provider-row details{margin-top:7px}
.provider-row details>summary{font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;padding:4px 0;min-height:30px}
.provider-detail-list{display:grid;gap:6px;padding-top:6px}
.provider-model{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:7px;min-width:0}
.provider-model .model-info{min-width:0;font-size:11px;overflow-wrap:anywhere}
.provider-model .model-info small{display:block;color:var(--muted)}
.home-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 5px}
.home-actions h2{font-size:15px;margin:0}
.home-footnote{font-size:10px;color:var(--soft);margin-top:9px;line-height:1.4}
.provider-multi-list{display:grid;gap:3px;margin-top:4px}
.provider-multi-entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;align-items:center;font-size:10px;line-height:1.25}
.provider-multi-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--muted)}
.provider-multi-entry strong{white-space:nowrap;font-size:10px}
@media(min-width:780px){.provider-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:330px){.home-kpi{padding:7px 5px}.home-kpi strong{font-size:11px}.provider-window{padding:6px}}

/* v2.1 portable save repair: persistent action on every screen */
.save-strip{background:#fff;border:1px solid #d4dcef;border-radius:15px;padding:11px 12px;margin:0 0 16px;box-shadow:var(--shadow);display:grid;gap:10px;align-items:center;grid-template-columns:minmax(0,1fr)}
.save-message{display:flex;gap:9px;align-items:flex-start;min-width:0}
.save-message strong{display:block;font-size:12px;line-height:1.3;color:#243a6b}
.save-message p{font-size:11px;color:var(--muted);line-height:1.45;margin:3px 0 0;overflow-wrap:anywhere}
.save-indicator{background:#168777;flex:0 0 9px;height:9px;border-radius:50%;margin-top:4px}
.save-indicator.attention{background:#bc6633}
.save-strip .btn{width:100%;min-height:40px;font-size:12px}
.save-strip .storage-note{color:#a04848}
@media(min-width:610px){.save-strip{grid-template-columns:minmax(0,1fr) auto}.save-strip .btn{width:auto}}

[hidden]{display:none!important}

function quotaCard(q){const s=subFor(q),pr=providerStyle(s.provider),u=q.used===''||q.used==null?null:Number(q.used),reset=nextReset(q),rel=difference(reset.date),kind=q.window==='5h'?'5-hour':q.window==='weekly'?'Weekly':'Other';return `<article class="card quota-card" data-quota-id="${escapeHTML(q.id)}"><div class="quota-head"><div class="provider-dot ${pr[0]}" aria-hidden="true">${pr[1]}</div><div class="quota-main"><div class="quota-title">${escapeHTML(q.model)}</div><div class="quota-caption">${escapeHTML(s.plan)} · ${escapeHTML(q.scope)}</div></div><span class="inline-tag ${q.window==='5h'?'h5':q.window}">${kind}</span></div><div class="quota-usage"><div class="used">${u===null?'—':u+'%'} <span>used</span></div><div class="remaining ${u===null?'unknown':''}">${u===null?'Remaining unknown':(100-u)+'% remaining'}</div></div><div class="progress" role="meter" aria-label="Used allowance" aria-valuemin="0" aria-valuemax="100" ${u===null?'':'aria-valuenow="'+u+'"'}><div class="fill ${u!==null&&u>=90?'critical':u!==null&&u>=75?'high':''}" style="width:${u===null?0:u}%"></div></div><div class="quota-foot"><div class="reset-wrap"><div class="label">${reset.estimated?'Estimated reset':'Tracked reset'}</div><div class="time ${rel.state==='expired'?'muted':''}" data-countdown-date="${escapeHTML(reset.date)}">${escapeHTML(rel.text)}</div><div class="date">${escapeHTML(fmtDate(reset.date))}</div></div><button class="tiny-btn" data-quick="${escapeHTML(q.id)}" aria-label="Quick update ${escapeHTML(q.model)}">Update</button></div><details class="mini-details"><summary>Details & more actions</summary><div class="detail-content"><div class="details-row"><b>Behavior:</b> ${escapeHTML(q.behavior||'manual')} · ${q.verified?'Marked verified':'Owner-reported / unchecked'}</div><div class="details-row">${escapeHTML(q.note||'No additional notes')}</div><div class="detail-actions"><button class="btn sm" data-edit="quota" data-id="${escapeHTML(q.id)}">Full edit</button><button class="btn sm soft" data-copy="${escapeHTML(q.id)}">Duplicate</button><button class="btn sm danger" data-delete="quota" data-id="${escapeHTML(q.id)}">Delete</button></div></div></details></article>`}
function upcomingItems(){const rows=[];data.milestones.forEach(m=>{if(parseBD(m.date))rows.push({group:'milestone',id:m.id,title:m.title,date:m.date,kind:m.kind,note:m.note})});data.subs.forEach(s=>{if(parseBD(s.cancelDate))rows.push({group:'sub',id:s.id,title:`${s.plan} · planned cancellation`,date:s.cancelDate,kind:'Cancellation (not done)',note:s.memo});if(parseBD(s.endDate))rows.push({group:'sub',id:s.id,title:`${s.plan} · trial/access date`,date:s.endDate,kind:'Trial end (estimate)',note:s.memo})});return rows.sort((a,b)=>parseBD(a.date).ms-parseBD(b.date).ms)}
function monthly(day){let n=Number(day);if(!Number.isInteger(n)||n<1||n>31)return '';let [y,m]=today().split('-').map(Number);for(let i=0;i<15;i++){const yy=y+Math.floor((m-1+i)/12),mm=(m-1+i)%12+1,last=new Date(Date.UTC(yy,mm,0)).getUTCDate(),d=`${yy}-${String(mm).padStart(2,'0')}-${String(Math.min(n,last)).padStart(2,'0')}`;if(d>=today())return d}return ''}
function allEvents(){const rows=upcomingItems();data.quotas.forEach(q=>{const reset=nextReset(q);if(parseBD(reset.date))rows.push({group:'quota',id:q.id,title:`${subFor(q).plan} · ${q.model} (${q.window})`,date:reset.date,kind:reset.estimated?'Estimated quota reset':'Tracked quota reset',note:q.note})});data.subs.forEach(s=>{const dt=monthly(s.renewDay);if(dt&&s.status!=='cancelled')rows.push({group:'sub',id:s.id,title:`${s.plan} · expected renewal day`,date:dt,kind:'Renewal · exact time unknown',note:'Derived monthly day; charge/date unverified'})});return rows.sort((a,b)=>parseBD(a.date).ms-parseBD(b.date).ms)}
function dateTile(s){const p=parseBD(s);if(!p)return {day:'?',month:'—'};const date=new Date(p.ms);return {day:new Intl.DateTimeFormat('en-GB',{timeZone:BD,day:'2-digit'}).format(date),month:new Intl.DateTimeFormat('en-GB',{timeZone:BD,month:'short'}).format(date)}}
function eventRow(e){const t=dateTile(e.date),r=difference(e.date);return `<div class="eventrow"><div class="eventdate"><div class="month">${escapeHTML(t.month)}</div><div class="day">${escapeHTML(t.day)}</div></div><div class="eventbody"><strong>${escapeHTML(e.title)}</strong><div class="meta">${escapeHTML(e.kind)} · ${escapeHTML(fmtDate(e.date))}</div></div><div class="eventend ${r.state==='expired'?'expired':r.state==='unknown'?'unknown':''}" data-countdown-date="${escapeHTML(e.date)}">${escapeHTML(r.text)}</div></div>`}
function windowCell(sub,quotaRows,window,label){
  const rows=quotaRows.filter(q=>q.window===window);
  const notApplicable=window==='5h'&&isGrokProvider(sub.provider);
  if(!rows.length)return `<div class="provider-window pool-${window}" aria-label="${escapeHTML(label)} no quota entered"><div class="provider-window-title">${escapeHTML(label)}</div><div class="provider-window-value">${notApplicable?'N/A':'—'}</div><div class="provider-window-remaining">${notApplicable?'Not applicable':'No pool entered'}</div></div>`;
  if(rows.length>1){
    const items=rows.slice(0,4).map(q=>{
      const used=q.used===''||q.used===null?'Unknown':escapeHTML(q.used+'% used');
      return `<div class="provider-multi-entry" title="${escapeHTML(q.model)}"><span class="provider-multi-name">${escapeHTML(q.model)}</span><strong>${used}</strong></div>`;
    }).join('');
    const next=rows.map(q=>nextReset(q)).filter(r=>{const p=parseBD(r.date);return p&&!p.dateOnly&&p.ms>Date.now()}).sort((a,b)=>parseBD(a.date).ms-parseBD(b.date).ms)[0];
    const resetText=next?`Earliest reset: <span data-countdown-date="${escapeHTML(next.date)}">${escapeHTML(difference(next.date).text)}</span>`:'Per-model reset unknown';
    return `<div class="provider-window pool-${window}" aria-label="${escapeHTML(label)} has ${rows.length} distinct quotas">
      <div class="provider-window-title">${escapeHTML(label)} · ${rows.length} pools</div>
      <div class="provider-multi-list">${items}${rows.length>4?'<div class="provider-window-remaining">+'+(rows.length-4)+' more · expand details</div>':''}</div>
      <div class="provider-window-reset">${resetText} · no averaging</div>
    </div>`;
  }
  const q=rows[0],known=q.used!==''&&q.used!==null&&Number.isFinite(Number(q.used)),used=known?Number(q.used):null,reset=nextReset(q),count=reset.date?difference(reset.date).text:'Reset not entered';
  return `<div class="provider-window pool-${window}" aria-label="${escapeHTML(label)} quota for ${escapeHTML(q.model)}">
    <div class="provider-window-title">${escapeHTML(label)}<span>${q.verified?'Checked':'Manual'}</span></div>
    <div class="provider-window-value">${known?used+'% used':'Unknown'}</div>
    <div class="provider-window-remaining">${known?100-used+'% remaining':escapeHTML(q.model)}</div>
    <div class="provider-mini-track" role="meter" aria-label="${escapeHTML(label)} used percentage" aria-valuemin="0" aria-valuemax="100" ${known?'aria-valuenow="'+used+'"':''}><div class="provider-mini-fill" style="width:${known?used:0}%"></div></div>
    <div class="provider-window-reset ${reset.estimated?'estimated':''}">${reset.estimated?'Estimated':'Tracked'} reset: <span ${reset.date?'data-countdown-date="'+escapeHTML(reset.date)+'"':''}>${escapeHTML(count)}</span></div>
  </div>`;
}
function homeUsageTone(q){
  if(q.used===''||q.used===null||!Number.isFinite(Number(q.used)))return 'unknown';
  return Number(q.used)>=90?'critical':Number(q.used)>=75?'high':'low';
}
function homeQuickChips(rows){
  if(!rows.length)return '<div class="home-quick-pools"><span class="home-pool-chip tone-unknown">No quota entered</span></div>';
  return '<div class="home-quick-pools" aria-label="Separate manual model usage">'+rows.map(q=>{
    const label=q.window==='5h'?'5h':q.window==='weekly'?'Weekly':'Custom';
    const tone=homeUsageTone(q),used=tone==='unknown'?'Unknown':Number(q.used)+'% used';
    const reset=nextReset(q),parsed=parseBD(reset.date),past=parsed&&!parsed.dateOnly&&parsed.ms<=Date.now();
    return '<span class="home-pool-chip tone-'+tone+'" title="'+escapeHTML(q.model)+'" aria-label="'+escapeHTML(label+' '+q.model+' '+used)+(past?', reset time passed':'')+'"><span class="pool-type">'+label+'</span><span class="pool-model">'+escapeHTML(q.model)+'</span><strong>'+escapeHTML(used)+'</strong>'+(past?'<span>time passed*</span>':'')+'</span>';
  }).join('')+'</div>';
}

  }).join('');
  return `<article class="card provider-row" data-sub-id="${escapeHTML(sub.id)}">

    ${homeQuickChips(rows)}

    <details><summary>Model details · ${rows.length} pool${rows.length===1?'':'s'}${rows.some(q=>q.window==='custom')?' incl. custom':''}</summary><div class="provider-detail-list">${items||'<div class="micro">No quota pools yet; add one from Quotas.</div>'}</div></details>
  </article>`;

let cockpitQuotaMode='grid',cockpitDateMode='soon';
function rankedQuotas(rows){return rows.map((q,i)=>({q,i})).sort((a,b)=>{const ak=a.q.used!==''&&a.q.used!==null&&Number.isFinite(Number(a.q.used)),bk=b.q.used!==''&&b.q.used!==null&&Number.isFinite(Number(b.q.used));return Number(bk)-Number(ak)||(bk?Number(b.q.used)-Number(a.q.used):0)||a.i-b.i}).map(x=>x.q)}
function maxHiddenUsed(rows){const q=rankedQuotas(rows).find(q=>q.used!==''&&q.used!==null&&Number.isFinite(Number(q.used)));return q?Number(q.used)+'%':'Unknown'}
function visualMeter(q){
 const known=q.used!==''&&q.used!==null&&Number.isFinite(Number(q.used)),p=known?Number(q.used):0;
 const tone=!known?'unknown':p>=90?'critical':p>=75?'high':'low';
 const color={low:'#148767',high:'#c8892f',critical:'#c3495b',unknown:'#8b98a9'}[tone];
 const dash=(p*1.13097).toFixed(2);
 return `<span class="cockpit-ring tone-${tone}" role="img" aria-label="${escapeHTML(q.model+' '+q.window+': '+(known?p+' percent used':'Unknown'))}" style="--meter:${color}"><svg aria-hidden="true" viewBox="0 0 43 43"><circle class="meter-track" cx="21.5" cy="21.5" r="18"/><circle class="meter-used" cx="21.5" cy="21.5" r="18" stroke-dasharray="${dash} 113.1"/></svg><span class="meter-text">${known?p+'%':'—'}</span></span>`;
}

  const next=copy(data),list=next[editor.key],i=list.findIndex(x=>x.id===editor.id);
  if(i>=0)list[i]=obj;else list.push(obj);
  const continueQuota=editor.kind==='sub'&&quotaOnboarding;
  if(!commit(next))return;
  const resumeProvider=editor.kind==='quota'?returnToProvider:null;
  closeSheet(()=>{if(continueQuota){changeTab('quotas');edit('quota');$('#sheetHint').textContent='Step 2 of 2: Choose the new Plan, enter a model and save the quota.';}else if(resumeProvider&&data.subs.some(s=>s.id===resumeProvider)){visualDialog('provider',resumeProvider);}});
}
function exportFile(name,contents,type){
 const url=URL.createObjectURL(new Blob([contents],{type}));
 const anchor=document.createElement('a');anchor.href=url;anchor.download=name;
 document.body.append(anchor);
 try{anchor.click();} finally {anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
}

function importDataset(x){
 if(sharedGitHubOrigin){alert('PRIVATE IMPORT HOLD: Use a dedicated Firebase Hosting hostname, not this shared GitHub Pages URL.');return false;}
 if(!validDataset(x)){alert('Invalid JSON dataset. Check that all quotas reference subscriptions, there are no duplicate IDs, and Grok has no 5-hour entries.');return false;}
 if(!confirm('Import replaces all currently saved entries. Export your existing JSON backup first if you need it. Proceed?'))return false;
 if(!commit(copy(x))){alert('Import not saved. Your prior browser records remain unchanged.');return false;}
 alert('Import saved. Reopen the same HTTPS address to verify persistence.');return true;
}
function doAction(which){
 if(which==='exportRaw'){if(storedRaw!==null)exportFile('AI_Quota_READ_ONLY_RECOVERY_'+new Date().toISOString().replace(/[:.]/g,'-')+'.txt',storedRaw,'text/plain');return;}
 if(recoveryRequired){alert('Read-only recovery is active. Export the unmodified stored copy first.');return;}
 if(which==='exportJSON')exportJSON();
 else if(which==='import'){
   if(sharedGitHubOrigin){alert('Private import is blocked on this shared GitHub Pages hostname.');return;}
   $('#filePicker').click();
 }
 else if(which==='pasteImport'){
   const area=$('#pasteJSON');if(!area)return;
   const raw=area.value;
   try {if(raw.length>5000000)throw Error('File exceeds 5 MB.');const x=JSON.parse(raw);importDataset(x);}
   catch(e){alert('Paste import failed: '+e.message)}
   finally {area.value='';}
 }
 else if(which==='reset'&&confirm('Clear all personal quota data from this browser? Export JSON backup first if you may need it later.')){commit(copy(original))}
}

  } else if(b.dataset.delete){
