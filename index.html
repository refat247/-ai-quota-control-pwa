/* Compact, accountable Home: a subscription is a separate provider/account group.
   Never sum percentages across distinct model quotas. */
.home-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:8px 0 12px}
.home-kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 8px;min-width:0}
.home-kpi small{color:var(--soft);font-size:10px;display:block;line-height:1.2}
.home-kpi strong{font-size:13px;line-height:1.3;display:block;margin-top:5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.home-kpi em{display:block;font-style:normal;font-size:9px;color:var(--soft);margin-top:3px}
.provider-list{display:grid;gap:8px;margin-top:10px}
.provider-row{padding:10px 11px;box-shadow:none}
.provider-row-header{display:flex;align-items:center;gap:9px;margin-bottom:8px;min-width:0}
.provider-row-header .provider-dot{width:29px;min-width:29px;height:29px;border-radius:9px}
.provider-row-headings{flex:1;min-width:0}
.provider-row-name{font-size:14px;font-weight:850;line-height:1.25;overflow-wrap:anywhere}
.provider-row-plan{font-size:10px;color:var(--muted);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.provider-row-header .inline-tag{font-size:9px;flex-shrink:0}
.provider-windows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.provider-window{border:1px solid #e8edf5;background:#f8faff;border-radius:9px;padding:6px 8px;min-width:0}
.provider-window-title{color:var(--muted);font-size:10px;font-weight:750;display:flex;align-items:center;justify-content:space-between;gap:4px}
.provider-window-value{font-size:13px;font-weight:850;line-height:1.3;white-space:normal;overflow-wrap:anywhere;margin-top:3px}
.provider-window-remaining{font-size:10px;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.provider-window-reset{font-size:10px;color:var(--soft);line-height:1.3;margin-top:4px;overflow-wrap:anywhere}
.provider-window-reset.estimated{color:var(--amber)}
.provider-mini-track{height:4px;border-radius:4px;background:#e3e9f3;overflow:hidden;margin-top:5px}
.provider-mini-fill{height:100%;background:var(--accent);border-radius:4px}
.provider-row details{margin-top:7px}
.provider-row details>summary{font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;padding:4px 0;min-height:30px}
.provider-detail-list{display:grid;gap:6px;padding-top:6px}
.provider-model{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:7px;min-width:0}
.provider-model .model-info{min-width:0;font-size:11px;overflow-wrap:anywhere}
.provider-model .model-info small{display:block;color:var(--muted)}
.home-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 5px}
.home-actions h2{font-size:15px;margin:0}
.home-footnote{font-size:10px;color:var(--soft);margin-top:9px;line-height:1.4}
.provider-multi-list{display:grid;gap:3px;margin-top:4px}
.provider-multi-entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;align-items:center;font-size:10px;line-height:1.25}
.provider-multi-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--muted)}
.provider-multi-entry strong{white-space:nowrap;font-size:10px}
@media(min-width:780px){.provider-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:330px){.home-kpi{padding:7px 5px}.home-kpi strong{font-size:11px}.provider-window{padding:6px}}

/* v2.1 portable save repair: persistent action on every screen */
.save-strip{background:#fff;border:1px solid #d4dcef;border-radius:15px;padding:11px 12px;margin:0 0 16px;box-shadow:var(--shadow);display:grid;gap:10px;align-items:center;grid-template-columns:minmax(0,1fr)}
.save-message{display:flex;gap:9px;align-items:flex-start;min-width:0}
.save-message strong{display:block;font-size:12px;line-height:1.3;color:#243a6b}
.save-message p{font-size:11px;color:var(--muted);line-height:1.45;margin:3px 0 0;overflow-wrap:anywhere}
.save-indicator{background:#168777;flex:0 0 9px;height:9px;border-radius:50%;margin-top:4px}
.save-indicator.attention{background:#bc6633}
.save-strip .btn{width:100%;min-height:40px;font-size:12px}
.save-strip .storage-note{color:#a04848}
@media(min-width:610px){.save-strip{grid-template-columns:minmax(0,1fr) auto}.save-strip .btn{width:auto}}

function readLabDraft(){
  labReadError=false;
  if(fileMode||sharedGitHubOrigin)return emptyLabDraft();
  try {
    labRaw=localStorage.getItem(LAB_STORE+labProvider.id);
    if(labRaw===null)return emptyLabDraft();
    const draft=JSON.parse(labRaw);
    if(!draft||Object.keys(draft).length!==Object.keys(LAB_FIELDS).length||
        !Object.keys(LAB_FIELDS).every(key=>labValueValid(key,draft[key])))throw Error('Invalid Lab draft');
    return draft;
  }catch(_){
    labReadError=true;
    return emptyLabDraft();
  }
}
function labControl(key,label,draft){
  const spec=LAB_FIELDS[key], value=escapeHTML(draft[key]);
  let input;
  if(spec.options){
    input=`<select name="${key}">${spec.options.map(([v,text])=>`<option value="${v}" ${v===value?'selected':''}>${text}</option>`).join('')}</select>`;
  }else if(spec.pattern){
    input=`<input name="${key}" value="${value}" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="${spec.pattern===LAB_ID_PATTERN?64:120}">`;
  }else {
    input=`<input name="${key}" type="number" inputmode="${spec.integer?'numeric':'decimal'}" min="0" max="${spec.max}" step="${spec.integer?'1':'any'}" value="${value}">`;
  }
  return `<label class="formlabel">${label}${input}</label>`;
}
function labDecisionHTML(draft,decision){
  const {status,reasons,scored,accepted,critical}=decision;
  const rate=key=>draft[key]===''||accepted===0?'—':(Number(draft[key])/accepted).toLocaleString('en',{maximumSignificantDigits:8});
  return `<div class="lab-decision"><h2>Manual status · independent review pending</h2><strong class="inline-tag ${status.startsWith('MANUAL PASS')?'good':status==='HOLD'?'warn':''}" id="lab-decision-status">${status}</strong></div>
  <p>${accepted}/10 accepted · ${scored}/10 scored · ${critical} critical</p>
  ${status!=='MANUAL PASS — REVIEW PENDING'&&status!=='NOT RUN'?`<ul>${reasons.map(reason=>`<li>${reason}</li>`).join('')}</ul>`:''}
  <dl class="lab-metrics">
    <div><dt>Cash USD / accepted</dt><dd>${rate('cash')}</dd></div>
    <div><dt>Credit USD / accepted</dt><dd>${rate('credit')}</dd></div>
    <div><dt>Quota / accepted</dt><dd>${draft.quotaType&&draft.quotaUnits!==''&&accepted?rate('quotaUnits')+' '+draft.quotaType:'—'}</dd></div>
  </dl>`;
}

function labFormDraft(form){
  return Object.fromEntries(Object.keys(LAB_FIELDS).map(key=>[key,form.elements.namedItem(key)?.value.trim()??'']));
}
function labCanLeave(){
  const form=$('#lab-form');
  if(!form||fileMode||sharedGitHubOrigin||labReadError)return true;
  const stored=labRaw===null?emptyLabDraft():JSON.parse(labRaw);
  const draft=labFormDraft(form);
  return Object.keys(stored).every(key=>stored[key]===draft[key])||confirm('Discard unsaved Provider Lab changes?');
}
function saveLabDraft(form){
  const message=$('#lab-save-message');
  if(fileMode||sharedGitHubOrigin||labReadError||labCohortReadError)return;
  const draft=labFormDraft(form);
  const invalid=Object.keys(draft).find(key=>form.elements.namedItem(key)?.validity.badInput||!labValueValid(key,draft[key]));
  if(invalid){
    const input=form.elements.namedItem(invalid);
    input.closest('details').open=true;
    input.focus();
    message.textContent='Draft not saved. Check the highlighted value. Use short identifiers, never credentials or URLs.';
    return;
  }
  const old=labRaw===null?emptyLabDraft():JSON.parse(labRaw);
  const hasResults=[...LAB_SMOKE.map(([key])=>key),'agentTurns','agentRef','budgetRef','smokeCalls',...LAB_CASES.map(({id})=>id+'ref')].some(key=>old[key]!=='');
  if(hasResults&&['run','requestedModel','model','route','effort'].some(key=>old[key]&&draft[key]!==old[key])){
    message.textContent='Draft not saved. Clear the saved draft before changing the run, requested/served model, route or effort.';
    return;
  }
  const raw=JSON.stringify(draft),key=LAB_STORE+labProvider.id;
  try{
    if(localStorage.getItem(key)!==labRaw){message.textContent='Draft changed in another tab. Reopen the Lab before saving.';return;}
    localStorage.setItem(key,raw);
    if(localStorage.getItem(key)!==raw)throw Error('Readback failed');
  }catch(_){message.textContent='Draft could not be saved reliably. Keep this tab open and check browser storage.';return;}
  labRaw=raw;
  const cohort=readLabCohort(),decision=providerLabDecision(labProvider,draft,cohort);
  $('#lab-summary').innerHTML=labDecisionHTML(draft,decision);
  const addToCohort=$('#lab-cohort-add');
  if(addToCohort)addToCohort.disabled=labCohortReadError||!decision.canJoinCohort||cohort.providerIds.includes(labProvider.id)||cohort.providerIds.length>=3;
  const removeFromCohort=$('#lab-cohort-remove');
  if(removeFromCohort)removeFromCohort.disabled=labCohortReadError||!cohort.providerIds.includes(labProvider.id);
  const quality=$('#lab-quality');
  if(quality){
    quality.disabled=!decision.qualityReady;
    $('#lab-quality-hint').textContent=decision.qualityReady?'Use fresh sessions. Give the model only the prompt, then score with the separate reviewer rubric.':'P01–P10 remains locked until the exact owner-approved budget addendum ID is configured in this build and all other gates pass.';
  }
  $('#lab-clear').disabled=false;
  message.textContent='Draft saved in this browser. Manual status: '+decision.status+'.';
}
function saveLabCohort(action){
  const message=$('#lab-cohort-message');
  if(!message||fileMode||sharedGitHubOrigin||labReadError||labCohortReadError)return;
  const cohort=readLabCohort();
  if(labCohortReadError){message.textContent='Cohort registry could not be read. No changes were made.';return;}
  const expected=labCohortRaw;
  const ref=$('#lab-cohort-ref')?.value.trim()||cohort.evidenceRef;
  let next;
  if(action==='add'){
    if(!ref||!labValueValid('run',ref)){message.textContent='Enter the redacted cohort-selection evidence ID from the canonical Sheet.';return;}
    const draft=readLabDraft();
    if(labReadError){message.textContent='Provider draft could not be read. No changes were made.';return;}
    const decision=providerLabDecision(labProvider,draft,cohort);
    if(!decision.canJoinCohort){message.textContent='Cannot add yet: complete preflight and smoke evidence. The owner-approved budget addendum must also be configured in this build; a typed reference alone cannot unlock P01–P10.';return;}
    next={providerIds:[...cohort.providerIds,labProvider.id],evidenceRef:ref};
  }else{
    if(!cohort.providerIds.includes(labProvider.id)){message.textContent='This provider is not in the cohort.';return;}
    next={providerIds:cohort.providerIds.filter(id=>id!==labProvider.id),evidenceRef:ref};
  }
  if(!labCohortValid(next)){message.textContent='Cohort limit or evidence reference is invalid. No changes were made.';return;}
  const raw=JSON.stringify(next);
  try{
    if(localStorage.getItem(LAB_COHORT_STORE)!==expected){message.textContent='Cohort registry changed in another tab. Reopen the Lab before editing.';return;}
    localStorage.setItem(LAB_COHORT_STORE,raw);
    if(localStorage.getItem(LAB_COHORT_STORE)!==raw)throw Error('Readback failed');
  }catch(_){message.textContent='Cohort registry could not be saved reliably. No change is confirmed.';return;}
  labCohortRaw=raw;
  render();
  const status=$('#lab-cohort-message');
  if(status)status.textContent=action==='add'?'Provider added to the local top-three cohort. Record the same selection in the canonical Sheet.':'Provider removed from the local top-three cohort.';
}
function clearLabDraft(){
  if(fileMode||sharedGitHubOrigin||labReadError||labCohortReadError||labRaw===null||!confirm('Clear this provider’s saved Lab draft? Preserve reviewed evidence in the canonical Sheet first.'))return;
  const cohort=readLabCohort();
  if(labCohortReadError||cohort.providerIds.includes(labProvider.id)){
    $('#lab-save-message').textContent='Remove this provider from the top-three cohort before clearing its draft.';
    return;
  }
  const key=LAB_STORE+labProvider.id,message=$('#lab-save-message');
  try{
    if(localStorage.getItem(key)!==labRaw){message.textContent='Draft changed in another tab. Reopen the Lab before clearing.';return;}
    localStorage.removeItem(key);
    if(localStorage.getItem(key)!==null)throw Error('Readback failed');
  }catch(_){message.textContent='Draft could not be cleared reliably. Check browser storage.';return;}
  render();
  $('#lab-provider').focus();
  $('#lab-save-message').textContent='Saved Lab draft cleared.';
}

function validateItem(kind,item){if(kind==='quota'){if(!item.model.trim())return 'Model name is required.';if(item.used!==''&&(!Number.isFinite(+item.used)||+item.used<0||+item.used>100))return 'Usage must be 0–100 or blank.';if(item.nextReset&&!parseBD(item.nextReset))return 'Invalid reset date. Use YYYY-MM-DD or YYYY-MM-DD HH:mm.';if(item.behavior==='usage-triggered')item.project=false;const hours=item.cycleHours;if(hours!==''&&(!Number.isFinite(+hours)||+hours<=0))return 'Projection interval must be a positive number.';if(!data.subs.some(s=>s.id===item.subId))return 'Select a valid subscription first.';if(isGrokProvider(subFor(item).provider)&&item.window==='5h')return 'No Grok 5-hour quota is tracked; choose Weekly or Custom.'}if(kind==='sub'){if(!item.plan.trim())return 'Plan name is required.';if([item.cancelDate,item.endDate].some(x=>x&&!parseBD(x)))return 'Invalid subscription date.';if(item.renewDay!==''&&(!Number.isInteger(+item.renewDay)||+item.renewDay<1||+item.renewDay>31))return 'Renewal day must be 1–31.'}if(kind==='milestone'&&item.date&&!parseBD(item.date))return 'Invalid deadline date.';if(kind==='milestone'&&!item.title.trim())return 'Deadline title required.';return ''}

function exportFile(name,contents,type){
 const url=URL.createObjectURL(new Blob([contents],{type}));
 const anchor=document.createElement('a');anchor.href=url;anchor.download=name;
 document.body.append(anchor);
 try{anchor.click();} finally {anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
}

function importDataset(x){
 if(sharedGitHubOrigin){alert('PRIVATE IMPORT HOLD: Use a dedicated Firebase Hosting hostname, not this shared GitHub Pages URL.');return false;}
 if(!validDataset(x)){alert('Invalid JSON dataset. Check that all quotas reference subscriptions, there are no duplicate IDs, and Grok has no 5-hour entries.');return false;}
 if(!confirm('Import replaces all currently saved entries. Export your existing JSON backup first if you need it. Proceed?'))return false;
 if(!commit(copy(x))){alert('Import not saved. Your prior browser records remain unchanged.');return false;}
 alert('Import saved. Reopen the same HTTPS address to verify persistence.');return true;
}
function doAction(which){
 if(which==='exportRaw'){if(storedRaw!==null)exportFile('AI_Quota_READ_ONLY_RECOVERY_'+new Date().toISOString().replace(/[:.]/g,'-')+'.txt',storedRaw,'text/plain');return;}
 if(recoveryRequired){alert('Read-only recovery is active. Export the unmodified stored copy first.');return;}
 if(which==='exportJSON')exportJSON();
 else if(which==='import'){
   if(sharedGitHubOrigin){alert('Private import is blocked on this shared GitHub Pages hostname.');return;}
   $('#filePicker').click();
 }
 else if(which==='pasteImport'){
   const area=$('#pasteJSON');if(!area)return;
   const raw=area.value;
   try {if(raw.length>5000000)throw Error('File exceeds 5 MB.');const x=JSON.parse(raw);importDataset(x);}
   catch(e){alert('Paste import failed: '+e.message)}
   finally {area.value='';}

  }

  else if(b.dataset.edit)edit(b.dataset.edit,b.dataset.id);
  else if(b.dataset.new)edit(b.dataset.new,null);

    if(recoveryRequired)return;

  else if(b.dataset.action)doAction(b.dataset.action);
});
