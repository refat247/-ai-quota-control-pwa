function refreshLive(){$('#localClock').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:BD,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date());$('#lastEdit').textContent='Last edit '+(data.meta.updated||'not yet edited');$$('[data-countdown-date]').forEach(n=>n.textContent=difference(n.getAttribute('data-countdown-date')).text)}
const defs={quota:[['subId','Subscription','select-sub'],['model','Model / quota name','text'],['scope','Account / tracked scope','text'],['window','Window type','select-window'],['used','Used % (blank if unknown)','number'],['nextReset','Next reset (Dhaka)','date-text'],['behavior','Reset behavior','select-behavior'],['cycleHours','Projection interval (hours)','number'],['project','Enable estimated projection','checkbox'],['verified','Personally verified in provider UI','checkbox'],['note','Notes','textarea']],sub:[['provider','Provider','text'],['plan','Plan name','text'],['emails','Accounts / members','textarea'],['status','Decision','select-status'],['renewDay','Renewal day (1–31)','number'],['cancelDate','Planned cancel (date)','date-text'],['endDate','End / expiry (date)','date-text'],['credit','Credit notes','textarea'],['memo','Other notes','textarea']],milestone:[['title','Title','text'],['date','Due date','date-text'],['kind','Category','text'],['note','Notes','textarea']]};
function field(name,label,type,value){const v=value??'',safe=escapeHTML(v);let control='';if(type==='checkbox')return `<label class="inline-check full"><input name="${name}" type="checkbox" ${v?'checked':''}> ${escapeHTML(label)}</label>`;if(type==='textarea')control=`<textarea name="${name}" rows="3">${safe}</textarea>`;else if(type==='select-sub')control=`<select name="${name}">${data.subs.map(s=>`<option value="${escapeHTML(s.id)}" ${v===s.id?'selected':''}>${escapeHTML(s.plan)}</option>`).join('')}</select>`;else if(type==='select-window')control=`<select name="${name}">${[['weekly','Weekly'],['5h','5-hour'],['custom','Custom / Bot']].map(([k,l])=>`<option value="${k}" ${k===v?'selected':''}>${l}</option>`).join('')}</select>`;else if(type==='select-behavior')control=`<select name="${name}">${[['usage-triggered','Usage-triggered / manual'],['time-driven','Time-driven / optional projection'],['weekly-scheduled','Weekly schedule'],['manual','Manual only']].map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('')}</select>`;else if(type==='select-status')control=`<select name="${name}">${Object.entries(statusNames).map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${escapeHTML(l)}</option>`).join('')}</select>`;else control=`<input type="${type==='number'?'number':'text'}" name="${name}" value="${safe}" ${type==='number'?'step="any" inputmode="decimal"':type==='date-text'?'placeholder="2026-11-18 09:00" inputmode="text"':''}>`;return `<label class="formlabel ${['model','scope','note','emails','memo','credit','plan','title'].includes(name)?'full':''}">${escapeHTML(label)}${control}</label>`}
function newItem(kind){if(kind==='quota')return {id:'quota-'+Date.now(),subId:data.subs[0]?.id||'',scope:'',model:'',window:'weekly',used:'',nextReset:'',behavior:'manual',cycleHours:'',project:false,verified:false,note:''};if(kind==='sub')return {id:'sub-'+Date.now(),provider:'',plan:'',emails:'',status:'unknown',renewDay:'',cancelDate:'',endDate:'',credit:'',memo:''};return {id:'milestone-'+Date.now(),title:'',date:'',kind:'quota-target',note:''}}
function edit(kind,id,quick=false){const key=kind==='quota'?'quotas':kind==='sub'?'subs':'milestones',orig=id?data[key].find(x=>x.id===id):null;if(id&&!orig)return;const item=orig?copy(orig):newItem(kind);editor={kind,key,id,item,quick};restoreFocus=document.activeElement;$('#sheetTitle').textContent=quick?'Quick update · '+item.model:id?'Edit '+({quota:'quota',sub:'plan',milestone:'deadline'}[kind]):'Add '+({quota:'quota',sub:'plan',milestone:'deadline'}[kind]);$('#sheetHint').textContent='Save updates this dashboard in your current browser. No download needed.';let fields=quick?[['used','Used % (0–100, or blank)','number'],['nextReset','Next reset · YYYY-MM-DD HH:mm or date','date-text'],['verified','Verified in provider UI?','checkbox']]:defs[kind];$('#sheetFields').innerHTML=fields.map(([n,l,t])=>field(n,l,t,item[n])).join('');$('#sheetSave').textContent='Save changes';document.querySelector('.layout').inert=true;$('#sheetback').classList.add('open');$('#sheetback').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('#editForm').querySelector('input,select,textarea')?.focus()}
function closeSheet(){$('#sheetback').classList.remove('open');document.querySelector('.layout').inert=false;$('#sheetback').setAttribute('aria-hidden','true');document.body.style.overflow='';editor=null;restoreFocus?.focus?.();restoreFocus=null}
function validateItem(kind,item){if(kind==='quota'){if(!item.model.trim())return 'Model name is required.';if(item.used!==''&&(!Number.isFinite(+item.used)||+item.used<0||+item.used>100))return 'Usage must be 0–100 or blank.';if(item.nextReset&&!parseBD(item.nextReset))return 'Invalid reset date. Use YYYY-MM-DD or YYYY-MM-DD HH:mm.';if(item.behavior==='usage-triggered')item.project=false;const hours=item.cycleHours;if(hours!==''&&(!Number.isFinite(+hours)||+hours<=0))return 'Projection interval must be a positive number.';if(!data.subs.some(s=>s.id===item.subId))return 'Select a valid subscription first.';if(/grok/i.test(subFor(item).provider)&&item.window==='5h')return 'No Grok 5-hour quota is tracked; choose Weekly or Custom.'}if(kind==='sub'){if(!item.plan.trim())return 'Plan name is required.';if([item.cancelDate,item.endDate].some(x=>x&&!parseBD(x)))return 'Invalid subscription date.';if(item.renewDay!==''&&(!Number.isInteger(+item.renewDay)||+item.renewDay<1||+item.renewDay>31))return 'Renewal day must be 1–31.'}if(kind==='milestone'&&item.date&&!parseBD(item.date))return 'Invalid deadline date.';if(kind==='milestone'&&!item.title.trim())return 'Deadline title required.';return ''}
function submitEditor(event){event.preventDefault();if(!editor)return;const obj=editor.item,frm=new FormData(event.currentTarget),fields=editor.quick?[['used',null,'number'],['nextReset',null,'date-text'],['verified',null,'checkbox']]:defs[editor.kind];for(const [n,_,type] of fields)obj[n]=type==='checkbox'?Boolean(event.currentTarget.elements[n].checked):String(frm.get(n)??'').trim();const error=validateItem(editor.kind,obj);if(error){alert(error);return}const list=data[editor.key],i=list.findIndex(x=>x.id===editor.id);if(i>=0)list[i]=obj;else list.push(obj);closeSheet();save()}
function exportFile(name,contents,type){
 const url=URL.createObjectURL(new Blob([contents],{type}));
 const anchor=document.createElement('a');anchor.href=url;anchor.download=name;
 document.body.append(anchor);
 try{anchor.click();} finally {anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
}
function exportJSON(){exportFile('AI_Quota_Backup_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json',JSON.stringify(data,null,2),'application/json')}
function importDataset(x){
 if(sharedGitHubOrigin){alert('PRIVATE IMPORT HOLD: Use a dedicated Firebase Hosting hostname, not this shared GitHub Pages URL.');return false;}
 if(!validDataset(x)){alert('Invalid JSON dataset. Check that all quotas reference subscriptions, there are no duplicate IDs, and Grok has no 5-hour entries.');return false;}
 if(!confirm('Import replaces all currently saved entries. Export your existing JSON backup first if you need it. Proceed?'))return false;
 data=copy(x);save();
 if(storageFailed){alert('Import is visible but browser storage failed. Do not trust this data to survive reopening.');return false;}
 alert('Import saved. Reopen the same HTTPS address to verify persistence.');return true;
}
function doAction(which){
 if(which==='exportJSON')exportJSON();
 else if(which==='import'){
   if(sharedGitHubOrigin){alert('Private import is blocked on this shared GitHub Pages hostname.');return;}
   $('#filePicker').click();
 }
 else if(which==='pasteImport'){
   const area=$('#pasteJSON');if(!area)return;
   const raw=area.value;
   try {if(raw.length>5000000)throw Error('File exceeds 5 MB.');const x=JSON.parse(raw);importDataset(x);}
   catch(e){alert('Paste import failed: '+e.message)}
   finally {area.value='';}
 }
 else if(which==='reset'&&confirm('Clear all personal quota data from this browser? Export JSON backup first if you may need it later.')){data=copy(original);save()}
}

$('#navigation').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)changeTab(b.dataset.tab)});
$('#appview').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab)changeTab(b.dataset.tab);else if(b.dataset.category){category=b.dataset.category;render()}else if(b.dataset.quick)edit('quota',b.dataset.quick,true);else if(b.dataset.edit)edit(b.dataset.edit,b.dataset.id);else if(b.dataset.new)edit(b.dataset.new,null);else if(b.dataset.copy){const q=data.quotas.find(x=>x.id===b.dataset.copy);if(q){const newq=copy(q);newq.id='copy-'+Date.now();newq.model+=' (copy)';data.quotas.push(newq);save();edit('quota',newq.id)}}else if(b.dataset.delete){const key={quota:'quotas',sub:'subs',milestone:'milestones'}[b.dataset.delete];if(b.dataset.delete==='sub'&&data.quotas.some(q=>q.subId===b.dataset.id)){alert('Reassign or delete this subscription’s quotas first.');return}if(confirm('Delete this entry from your local dashboard?')){data[key]=data[key].filter(x=>x.id!==b.dataset.id);save()}}else if(b.dataset.expandDates){allDeadlines=!allDeadlines;render()}else if(b.dataset.action)doAction(b.dataset.action)});
$('#appview').addEventListener('input',e=>{if(e.target.id==='quotaSearch'){query=e.target.value;renderQuotaList()}});
$('#appview').addEventListener('change',e=>{if(e.target.id==='providerFilter'){provider=e.target.value;renderQuotaList()}else if(e.target.id==='sortFilter'){sort=e.target.value;renderQuotaList()}});
$('#sheetClose').addEventListener('click',closeSheet);$('#sheetCancel').addEventListener('click',closeSheet);$('#sheetback').addEventListener('click',e=>{if(e.target.id==='sheetback')closeSheet()});$('#editForm').addEventListener('submit',submitEditor);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&editor)closeSheet();if(e.key==='Tab'&&editor){const focusables=$$('#sheetback input:not([disabled]),#sheetback select:not([disabled]),#sheetback textarea:not([disabled]),#sheetback button:not([disabled])');if(!focusables.length)return;const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
$('#filePicker').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5e6)throw new Error('Backup file exceeds 5 MB.');const x=JSON.parse(await file.text());importDataset(x)}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}});
render();setInterval(refreshLive,30000);
})();
